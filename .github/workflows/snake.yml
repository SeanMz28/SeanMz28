name: Contribution snake

# Redraws the snake that eats the contribution graph in the README, in the portfolio's orange.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#c2410c&color_dots=#ebedf0,#ffd8c2,#ffb089,#f07a3f,#c2410c
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff7a3d&color_dots=#161b22,#3b1f10,#6b3214,#b4501a,#ff7a3d

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
